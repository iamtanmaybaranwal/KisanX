; Jal-Drishti ESP32 firmware
;   pio run -e esp32dev                 build
;   pio run -e esp32dev -t upload       flash (ESP32 on USB, data cable)
;   pio device monitor                  serial console (type "help")
;   pio test -e native                  unit tests of the safety logic, on the laptop

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    arduino-libraries/LiquidCrystal @ ^1.0.7
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++17 -Wall -Wextra
