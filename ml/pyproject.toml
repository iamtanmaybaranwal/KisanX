[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaldrishti-ml"
version = "1.0.0"
description = "Jal-Drishti edge-AI soil-moisture forecasting"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.2", "pandas==2.3.3", "scikit-learn==1.8.0", "joblib==1.6.0"]

[tool.setuptools]
packages = ["jaldrishti_ml"]
